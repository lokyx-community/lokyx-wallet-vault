name: market-contracts

# The prediction market: the rules engine (native tests), the LOKYX contract (built to WebAssembly), and the
# BNB Chain contract (Foundry tests). The wasm is uploaded as base64 so it can be pasted into
# wallet/src/lib/contracts-wallet.ts.
on:
  push:
    paths:
      - "wallet/contracts/**"
      - ".github/workflows/market-contracts.yml"
  pull_request:
    paths:
      - "wallet/contracts/**"

jobs:
  lokyx:
    name: LOKYX market (engine tests, wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet/contracts
      - run: cargo test -p market-engine
      # The wallet can only encode a few argument types. The ABI may use nothing else.
      - name: ABI uses only types the wallet can encode
        run: |
          python3 - <<'PY'
          import json
          ok = {"address", "amount", "bool", "string", "u64", "list<address>"}
          abi = json.load(open("market/abi.json"))
          bad = []
          def check(where, t):
              for x in (t if isinstance(t, list) else [t]):
                  if x not in ok: bad.append((where, x))
          for m in abi["methods"]:
              for _, t in m["args"]: check(m["name"], t)
              if "returns" in m: check(m["name"], m["returns"])
          for e in abi["events"]:
              for _, t in e["fields"]: check(e["name"], t)
          assert not bad, bad
          print("ABI types ok")
          PY
      - run: cargo build -p market --release --target wasm32-unknown-unknown
      - run: |
          ls -l target/wasm32-unknown-unknown/release/market.wasm
          base64 -w0 target/wasm32-unknown-unknown/release/market.wasm > market.wasm.b64
          wc -c market.wasm.b64
          echo "WASM_B64_BEGIN"; cat market.wasm.b64; echo; echo "WASM_B64_END"
      - uses: actions/upload-artifact@v4
        with:
          name: market-wasm
          path: |
            wallet/contracts/market.wasm.b64
            wallet/contracts/market/abi.json

  bnb:
    name: BNB market (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet/contracts/evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge build --sizes
      - run: mkdir -p coverage-out && rm -f coverage-out/counters.csv
      - run: forge test -vv
      - name: Totals over every invariant run
        run: |
          echo "runs: $(wc -l < coverage-out/counters.csv)"
          awk -F, '{for(i=1;i<=NF;i++)s[i]+=$i; for(i=1;i<=NF;i++) if($i>0) r[i]++} END{
            split("trades fullBookPlaces evictions cancels proposals disputes finalized panelDecided expiredNoAnswer expiredStuckDispute claims shareTransfers",n," ");
            for(i=1;i<=12;i++) printf "%-22s total %-8d runs that reached it: %d\n", n[i], s[i], r[i]}' coverage-out/counters.csv
      # Static analysis. Findings are printed in full and kept as a file; the job does not fail on them so they can be
      # read and judged, and nothing here is "fixed" by hiding it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer solc-select
      - run: solc-select install 0.8.26 && solc-select use 0.8.26
      - run: slither . --filter-paths "lib|test|script" --solc-remaps "forge-std/=lib/forge-std/src/" --exclude-informational --json slither.json || true
      - run: slither . --filter-paths "lib|test|script" --solc-remaps "forge-std/=lib/forge-std/src/" --print human-summary || true
      - uses: actions/upload-artifact@v4
        with:
          name: slither
          path: wallet/contracts/evm/slither.json

  plan:
    name: Mutation plan
    runs-on: ubuntu-latest
    needs: bnb
    outputs:
      indexes: ${{ steps.count.outputs.indexes }}
    steps:
      - uses: actions/checkout@v4
      - id: count
        working-directory: wallet/contracts/evm
        run: |
          n=$(python3 script/mutate.py --count)
          echo "indexes=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutant ${{ matrix.index }}
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJson(needs.plan.outputs.indexes) }}
    defaults:
      run:
        working-directory: wallet/contracts/evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      # Plants one deliberate bug and checks that some test fails. A mutant that survives is a gap in the tests.
      - run: python3 script/mutate.py ${{ matrix.index }}

  engine-mutants:
    name: LOKYX engine (mutation check)
    runs-on: ubuntu-latest
    needs: lokyx
    defaults:
      run:
        working-directory: wallet/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet/contracts
      - run: cargo install cargo-mutants --locked
      # Changes the engine one small way at a time (a + into a -, a < into a <=, a return value, ...) and checks that a test fails.
      # A change no test notices is listed as MISSED.
      - run: cargo mutants -p market-engine --no-shuffle --timeout 60 -- --lib
