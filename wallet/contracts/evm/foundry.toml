[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200

fs_permissions = [{ access = "read-write", path = "./coverage-out" }]

[fuzz]
runs = 512

[invariant]
runs = 512
depth = 200
fail_on_revert = false
show_metrics = true
