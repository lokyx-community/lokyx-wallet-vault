name = "lokyx-risk"
main = "worker.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Rebuild the lists every 6 hours.
[triggers]
crons = ["0 */6 * * *"]

# One storage space for the lists. Make it once: `npx wrangler kv namespace create LISTS`, then put the id it prints here.
[[kv_namespaces]]
binding = "LISTS"
id = "PUT_THE_ID_FROM_WRANGLER_HERE"
