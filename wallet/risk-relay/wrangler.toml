name = "lokyx-risk"
main = "worker.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# One storage space for the lists. build-lists.mjs (on your server) fills it; this Worker only serves it.
# Make it once: `npx wrangler kv namespace create LISTS`, then put the id it prints here.
[[kv_namespaces]]
binding = "LISTS"
id = "PUT_THE_ID_FROM_WRANGLER_HERE"
